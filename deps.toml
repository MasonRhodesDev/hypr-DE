# Declarative runtime-dependency manifest. THE source of truth for package
# dependencies: packaging/gen-deps.sh renders these into the spec and PKGBUILD
# and CI fails when they drift. Every entry names the component that needs it
# so deps can be dropped when their component goes.

[compositor]
reason = "Hyprland Lua config API (hl.bind / hyprland.lua). Floor is 0.56: 0.55 has a fullscreen-vs-monitor-removal segfault (null monitor in CLayoutManager::recalculateMonitor, fixed upstream by the #14705 fullscreen refactor, first release v0.56.0). hyprland-git Provides hyprland= so a 0.56+ git build satisfies this."
fedora = ["hyprland >= 0.56"]
arch = ["hyprland>=0.56"]

[lock-idle]
reason = "vigil (vigil-lock lock_cmd / before_sleep_cmd), hypridle (idle policy in hypr/hypridle.conf); SUPER+L is loginctl lock-session which hypridle answers. Floor is vigil 0.3: lock-cmd.sh and hypridle.conf use --wait/--warn/--no-warn, which 0.2.x rejects — an unversioned dep let hypr-de 0.2.14 pair with vigil 0.2.16 and silently break idle/suspend locking. Floor is hypridle 0.1.8: the locked-screen listener needs per-listener condition_cmd/condition_retry (0.1.8) and ignore_inhibit (0.1.6); an older hypridle drops the unknown keys and would blank 30 s into any idle, locked or not."
fedora = ["vigil >= 0.3.0", "hypridle >= 0.1.8"]
arch = ["vigil>=0.3.0", "hypridle>=0.1.8"]
units = ["hypridle.service", "logind-idle-control.service", "logind-idle-control-tray.service"]

[bar]
reason = "waybar + CFFI workspace buttons module (waybar/config.jsonc). Floor 1.1.2: older modules click-dispatch the classic \"hyprctl dispatch workspace N\", which Hyprland with the Lua config parses as Lua and rejects, so workspace buttons silently do nothing. hyprland-workspace-zones: the workspace-zones compositor plugin (main.lua loads it from /usr/lib64/hyprland/plugins; zones keybinds error without it) — Fedora subpackage since 1.2.0, version-pinned to hyprland; on Arch the plugin ships inside waybar-workspace-buttons itself"
fedora = ["waybar", "waybar-workspace-buttons >= 1.1.2", "hyprland-workspace-zones"]
arch = ["waybar", "waybar-workspace-buttons>=1.1.2"]
units = ["waybar.service"]

[tray]
reason = "sni-watcher owns org.kde.StatusNotifierWatcher (Type=dbus, Before=waybar.service) so Waybar's tray module attaches as host-only"
fedora = ["sni-watcher"]
arch = ["sni-watcher"]
units = ["sni-watcher.service"]

[bluetooth]
reason = "BlueZ daemon (enabled on install) + OBEX; waybar bluetooth module is the indicator (no tray applet); left-click opens Overskride (GTK4/libadwaita pairing/profiles/files); right-click toggles adapter power. PipeWire/WirePlumber own BT audio. Overskride is hosted on [mason] and solaris765/hypr-de-extras (not in extra/Fedora)."
fedora = ["bluez", "bluez-obexd", "overskride"]
arch = ["bluez", "bluez-obex", "bluez-utils", "overskride"]
units = ["obex.service"]

[notifications]
reason = "swaync daemon (swaync/config.json, recovery framework, waybar module)"
fedora = ["SwayNotificationCenter"]
arch = ["swaync"]
units = ["swaync.service"]

[launcher]
reason = "fuzzel (SUPER+R bind, power-menu.sh + SUPER+SHIFT+/ cheatsheet dmenu backend)"
fedora = ["fuzzel"]
arch = ["fuzzel"]

[portal-polkit]
reason = "portal frontend + xdph backend (hypr/xdph.conf) + gtk Settings backend (LMTT appearance) + polkit agent (preset unit)"
fedora = ["xdg-desktop-portal", "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk", "hyprpolkitagent"]
arch = ["xdg-desktop-portal", "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk", "hyprpolkitagent"]
units = ["hyprpolkitagent.service"]

[session]
reason = "uwsm env files for the stock Hyprland (uwsm) session + swaybg wallpaper unit. python3-pyxdg: the nett00n COPR uwsm RPM omits it, and without the xdg module uwsm tracebacks on import — every greeter login dies in ~100ms with no log"
fedora = ["uwsm", "swaybg", "python3-pyxdg"]
arch = ["uwsm", "swaybg"]
units = ["hyprstate.service"]

[screenshot]
reason = "hypr-de-snip/record: grim, slurp, swappy annotation, hyprpicker freeze, wl-clipboard; gpu-screen-recorder is weak on Fedora (no repo package — hand-build or flatpak; packaging it is a 1.0-gate item like hyprland)"
fedora = ["grim", "slurp", "swappy", "hyprpicker", "wl-clipboard"]
fedora_weak = ["gpu-screen-recorder"]
arch = ["grim", "slurp", "swappy", "hyprpicker", "wl-clipboard", "gpu-screen-recorder"]

[script-runtime]
reason = "socat (configreload-listener), playerctl (media-osd, waybar media), brightnessctl (brightness-osd), jq (swaync focus-sender, snip, cheatsheet, updates JSON), libnotify (OSD + help fallback), python3+dbus+gobject (waybar-mediaplayer, hypr-de-theme, hypr-de-help)"
fedora = ["socat", "playerctl", "brightnessctl", "jq", "/usr/bin/notify-send", "python3", "python3-dbus", "python3-gobject"]
arch = ["socat", "playerctl", "brightnessctl", "jq", "libnotify", "python", "python-dbus", "python-gobject"]

[audio]
reason = "PipeWire server + WirePlumber session + Pulse/ALSA compat; wpctl binds + volume-osd; waybar pulseaudio module; pavucontrol (app mixer); hyprpwcenter (patchbay, SHIFT+XF86AudioPlay); playerctl is MPRIS not routing"
fedora = ["pipewire", "wireplumber", "pipewire-pulseaudio", "pipewire-alsa", "pavucontrol", "hyprpwcenter"]
arch = ["pipewire", "wireplumber", "pipewire-pulse", "pipewire-alsa", "pavucontrol", "hyprpwcenter"]

[theming]
reason = "lmtt renders all styles (SUPER+T, autostart); matugen palette extraction; hyprstate monitor profiles/power; dials settings app (displays/power/More); logind-idle-control; qt6ct (QT_QPA_PLATFORMTHEME); gnome-keyring (uwsm/env + greetd PAM)"
fedora = ["lmtt", "matugen", "hyprstate", "dials", "logind-idle-control", "qt6ct", "gnome-keyring"]
arch = ["lmtt", "matugen", "hyprstate", "dials", "logind-idle-control", "qt6ct", "gnome-keyring"]

[hypr-ecosystem]
reason = "Official hyprwm extras the session needs: hyprshutdown (power-menu.sh), hyprland-guiutils (hyprland-dialog), hyprland-qt-support (QML for hyprpolkitagent/hyprpwcenter). Not listed: hyprlock (vigil), hyprpaper (swaybg), hyprlauncher (fuzzel), hyprshot (grim/slurp/swappy), hyprsunset (optional night light). hyprqt6engine and hyprsysteminfo are -git/unofficial only, not extra/COPR. NVIDIA drivers are never a dep — session env applies only if the nvidia module is already loaded."
fedora = ["hyprshutdown", "hyprland-guiutils", "hyprland-qt-support"]
arch = ["hyprshutdown", "hyprland-guiutils", "hyprland-qt-support"]

[desktop-misc]
reason = "udiskie automount (preset unit), kitty (SUPER+Q terminal, updates-check), nautilus (SUPER+E; GTK4/libadwaita follows LMTT portal appearance), gtk4+libadwaita (hypr-de-help), NetworkManager (enabled on install) + nm-applet, man-db (hypr-de-help 'man hypr-de' / 'man workspace-zones' buttons; pages are shipped but a cloud/minimal image has no man binary)"
fedora = ["udiskie", "kitty", "NetworkManager", "network-manager-applet", "nautilus", "gtk4", "libadwaita", "man-db"]
arch = ["udiskie", "kitty", "networkmanager", "network-manager-applet", "nautilus", "gtk4", "libadwaita", "man-db"]
units = ["udiskie.service"]

[editor]
reason = "neovim is the packaged default editor: hypr-de-help's Edit local.lua action and EDITOR/VISUAL in the uwsm env point at it, and /etc/xdg/nvim/sysinit.vim plus the hypr-de-nvim lmtt module theme it. Without it that action fails on a fresh install"
fedora = ["neovim"]
arch = ["neovim"]

[fonts]
reason = "waybar/swaync stylesheets (JetBrainsMono Nerd Font, Symbols Nerd Font), lock/UI labels (Noto Sans). Fedora has no Nerd variants in its repos, so the patched families come from hypr-de-extras — without them every bar/notification glyph is tofu"
fedora = ["jetbrains-mono-fonts", "google-noto-sans-fonts", "fira-code-fonts", "jetbrains-mono-nerd-fonts", "nerd-fonts-symbols"]
arch = ["ttf-jetbrains-mono-nerd", "noto-fonts", "ttf-firacode-nerd", "ttf-nerd-fonts-symbols"]

[icons]
reason = "Full app-icon theme for fuzzel/swaync/GTK apps: adwaita-icon-theme dropped its app icons, so hicolor-only apps aside, a fresh install shows blank icons everywhere. Papirus is official on both distros; hypr-de-setup seeds it as the gsettings default and lmtt flips the -Dark variant per mode"
fedora = ["papirus-icon-theme"]
arch = ["papirus-icon-theme"]

[gaming]
reason = "hypr-de-gaming subpackage: bp-game-focus (hyprland socket events), steam scope cleanup"
subpackage = "gaming"
fedora = ["python3"]
arch = ["python"]

[optional-extras]
reason = "not installed or started by default: wayland-voice-dictation (optional suite app), hyprsunset (night light via local.lua), satty (alt snip annotator). NVIDIA packages are never pulled — detect-and-env only."
fedora = []
arch = []
fedora_weak = ["hyprsunset", "satty"]
