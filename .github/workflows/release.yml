name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@v1
    secrets:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      ARCH_REPO_TOKEN: ${{ secrets.ARCH_REPO_TOKEN }}
    with:
      spec-name: hypr-de
      copr-project: hypr-de
      extra-repos: |
        [mason]
        SigLevel = Required DatabaseRequired
        Server = https://masonrhodesdev.github.io/arch-repo/x86_64
      extra-repo-key-url: https://masonrhodesdev.github.io/arch-repo/mason-repo.asc
      extra-repo-key-fingerprint: 41450EEF8CEE7AB8CD3896221284404A6B70485C
