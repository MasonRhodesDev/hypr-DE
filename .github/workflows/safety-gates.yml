name: Safety gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: safety-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell, Python and Lua
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install the pinned linters
        run: |
          python3 -m venv "$RUNNER_TEMP/gates"
          "$RUNNER_TEMP/gates/bin/pip" install --require-hashes -r tests/gates/requirements.txt
          curl -fsSL -o "$RUNNER_TEMP/gates/bin/luacheck" \
            https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          echo "d68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc  $RUNNER_TEMP/gates/bin/luacheck" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gates/bin/luacheck"
          echo "$RUNNER_TEMP/gates/bin" >>"$GITHUB_PATH"
      - name: Gates
        run: tests/gates/check.sh classify shell python lua

      # A pull request that changes the gates is also judged by the gates it would replace, so it cannot
      # loosen a rule in the same change that relies on it. Not run when the gate code is unchanged.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gates
          sparse-checkout: tests/gates
          persist-credentials: false
      - name: Gates from the base branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mv base-gates "$RUNNER_TEMP/base-gates"
          base=$RUNNER_TEMP/base-gates/tests/gates
          if [[ ! -f $base/gate.py ]] || ! grep -q -- '--tree' "$base/gate.py"; then
            echo "the base branch has no gate that can judge another tree"
          elif cmp -s "$base/gate.py" tests/gates/gate.py && cmp -s "$base/shim.py" tests/gates/shim.py; then
            echo "the gate code is unchanged, so the gates above already judged it"
          else
            python3 -I "$base/gate.py" --tree "$GITHUB_WORKSPACE" classify shell python lua
          fi

  cpp:
    name: C++ packages, sanitizers and clang-tidy
    runs-on: ubuntu-24.04
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    env:
      # GCC, Hyprland and the rest come from this Arch Linux Archive day, so the baseline's counts move only when it does
      ARCH_SNAPSHOT: 2026/11/18
    steps:
      - name: Install the toolchain
        run: |
          echo "Server = https://archive.archlinux.org/repos/$ARCH_SNAPSHOT/\$repo/os/\$arch" >/etc/pacman.d/mirrorlist
          pacman -Syy --noconfirm archlinux-keyring
          pacman -Suu --noconfirm --needed base-devel cmake git python

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Hyprland's headers when a plugin is present
        shell: bash
        run: |
          if compgen -G 'plugins/*/CMakeLists.txt' >/dev/null; then
            pacman -S --noconfirm --needed hyprland
          fi

      - name: Install the pinned clang-tidy
        run: |
          python -m venv /opt/gates
          /opt/gates/bin/pip install --require-hashes -r tests/gates/requirements.txt
          echo /opt/gates/bin >>"$GITHUB_PATH"

      - name: C++ gates
        run: tests/gates/check.sh cpp-harden cpp-sanitize cpp-tidy cpp-selftest

      # A pull request that changes the gates is also judged by the gates it would replace, so it cannot
      # loosen a rule in the same change that relies on it. Not run when the gate code is unchanged.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-gates
          sparse-checkout: tests/gates
          persist-credentials: false
      - name: Gates from the base branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mv base-gates "$RUNNER_TEMP/base-gates"
          base=$RUNNER_TEMP/base-gates/tests/gates
          if [[ ! -f $base/gate.py ]] || ! grep -q -- '--tree' "$base/gate.py"; then
            echo "the base branch has no gate that can judge another tree"
          elif cmp -s "$base/gate.py" tests/gates/gate.py && cmp -s "$base/shim.py" tests/gates/shim.py; then
            echo "the gate code is unchanged, so the gates above already judged it"
          else
            python3 -I "$base/gate.py" --tree "$GITHUB_WORKSPACE" cpp-harden cpp-sanitize cpp-tidy
          fi
