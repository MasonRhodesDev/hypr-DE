name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # the baseline gate compares against the base revision
          fetch-depth: 0
      - name: Install the pinned linters
        run: |
          python3 -m venv "$RUNNER_TEMP/gates"
          "$RUNNER_TEMP/gates/bin/pip" install --require-hashes -r tests/gates/requirements.txt
          curl -fsSL -o "$RUNNER_TEMP/gates/bin/luacheck" \
            https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          echo "d68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc  $RUNNER_TEMP/gates/bin/luacheck" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gates/bin/luacheck"
          echo "$RUNNER_TEMP/gates/bin" >>"$GITHUB_PATH"
      - name: Shell, Python and Lua gates, and the baseline only shrinks
        env:
          GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: tests/gates/check.sh shell python lua baseline
      - name: no literal install paths in dist sources
        run: |
          ! grep -rn "/usr/share/hypr-de\|/usr/libexec/hypr-de\|/usr/lib/hypr-de" dist/ \
            || { echo "dist/ must use @TOKENS@ (see packaging/paths.conf)"; exit 1; }
      - name: deps.toml in sync with spec + PKGBUILD
        run: ./packaging/gen-deps.sh check

      - name: Service-activation completeness
        run: ./packaging/check-units.sh

      - name: Tests run sealed
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
          bad=0
          for f in tests/*.sh; do
            sed -n 2p "$f" | grep -qxF '[ -e /run/tripwire/hits ] || { [ "${HYPR_DE_SEALED-}" = build-root ] && [ ! -e /run/systemd/private ]; } || exec "$(dirname -- "$0")/run" "$0"' \
              || { echo "$f must re-enter tests/run on line 2"; bad=1; }
          done
          for f in tests/qemu-fresh/*.sh; do
            [ "$f" = tests/qemu-fresh/run.sh ] && continue
            sed -n 2p "$f" | grep -qxF '[ -e /etc/hypr-de-qemu-fresh ] || { echo "$0: runs only inside the qemu-fresh VM" >&2; exit 2; }' \
              || { echo "$f must refuse to run outside a VM on line 2"; bad=1; }
          done
          exit "$bad"

      - name: Installer trust behaviour
        run: ./tests/installer-trust.sh
      - name: Scene plugin places the logo where scene.py does
        run: ./tests/scene-geometry.sh
      - name: Scene plugin releases the scene by its readiness rule, and refuses bad scene commands
        run: ./tests/scene-readiness.sh
      - name: Every package names the scene plugin at the path it is installed to
        run: ./tests/scene-plugin-path.sh
      - name: Steam launch-option validation
        run: ./tests/steam-launch-options.sh

      - name: Command construction
        run: ./tests/command-construction.sh
      - name: Media module streams instead of polling
        run: ./tests/media-stream.sh
      - name: User config safety
        run: ./tests/user-config-safety.sh
      - name: Privacy and privilege boundaries
        run: ./tests/privacy-privilege.sh
      - name: Runtime state paths
        run: ./tests/runtime-paths.sh
      - name: swaybg and the lock screen read the same wallpaper
        run: ./tests/wallpaper-source.sh
      - name: A wallpaper set anywhere reaches the desktop
        run: ./tests/wallpaper-sync.sh
      - name: Blank-guard on monitor re-add
        run: ./tests/blank-guard.sh
      - name: PAM rewrite safety
        run: ./tests/pam-rewrite.sh
      - name: Power menu exits through desktop-boot-exit
        run: ./tests/power-menu-exit.sh
      - name: Lock policy routing
        run: ./tests/lock-policy.sh
      - name: Per-host idle timeouts
        run: ./tests/hypridle-override.sh
      - name: Screen-share consent scoping
        run: ./tests/share-consent.sh

  cpp:
    name: C++ hardening, sanitizers and clang-tidy
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install the toolchain
        run: pacman -Syu --noconfirm --needed base-devel cmake git python

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Hyprland's headers when a plugin is present
        shell: bash
        run: |
          if compgen -G 'plugins/*/CMakeLists.txt' >/dev/null; then
            pacman -S --noconfirm --needed hyprland
          fi

      - name: Install the pinned clang-tidy
        run: |
          python -m venv /opt/gates
          /opt/gates/bin/pip install --require-hashes -r tests/gates/requirements.txt
          echo /opt/gates/bin >>"$GITHUB_PATH"

      - name: C++ gates
        run: tests/gates/check.sh cpp-harden cpp-sanitize cpp-tidy cpp-selftest
