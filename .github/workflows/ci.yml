name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # dist/bin/hypr-de-* includes Python (hypr-de-theme, hypr-de-help).
          # Only pass files whose shebang is a shell.
          mapfile -t scripts < <(
            for f in packaging/*.sh dist/bin/hypr-de-* dist/libexec/*.sh \
                     dist/libexec/osd/*.sh dist/libexec/waybar-updates-check \
                     dist/libexec/hypr-de-prime-theme get-hypr-de.sh \
                     tests/qemu-fresh/*.sh; do
              [ -f "$f" ] || continue
              head -n1 "$f" | grep -qE '^#!/((usr/)?bin/(env )?)?(ba)?sh' && printf '%s\n' "$f"
            done
          )
          shellcheck -S warning -e SC1091 "${scripts[@]}"
      - name: no literal install paths in dist sources
        run: |
          ! grep -rn "/usr/share/hypr-de\|/usr/libexec/hypr-de\|/usr/lib/hypr-de" dist/ \
            || { echo "dist/ must use @TOKENS@ (see packaging/paths.conf)"; exit 1; }
      - name: deps.toml in sync with spec + PKGBUILD
        run: ./packaging/gen-deps.sh check

      - name: Service-activation completeness
        run: ./packaging/check-units.sh

      - name: Installer trust behaviour
        run: ./tests/installer-trust.sh
      - name: Steam launch-option validation
        run: ./tests/steam-launch-options.sh

      - name: Command construction
        run: ./tests/command-construction.sh
      - name: User config safety
        run: ./tests/user-config-safety.sh
      - name: Privacy and privilege boundaries
        run: ./tests/privacy-privilege.sh
      - name: Runtime state paths
        run: ./tests/runtime-paths.sh
      - name: PAM rewrite safety
        run: ./tests/pam-rewrite.sh
      - name: Lock policy routing
        run: ./tests/lock-policy.sh
      - name: Screen-share consent scoping
        run: ./tests/share-consent.sh
