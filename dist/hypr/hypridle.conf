$lock_timeout = 180
$blank_timeout = 30
$suspend_timeout = 900
# hypr-de: host overrides go below this line (hypridle-launch)

general {
  after_sleep_cmd=hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
  lock_cmd=@LIBEXECDIR@/lock-cmd.sh
  before_sleep_cmd=@LIBEXECDIR@/lock-cmd.sh --sleep
  inhibit_sleep=3
}

listener {
  timeout=$lock_timeout
  condition_cmd=@LIBEXECDIR@/no-keep-awake.sh
  condition_retry=10
  on-timeout=@LIBEXECDIR@/lock-cmd.sh --idle
}

listener {
  timeout=$blank_timeout
  ignore_inhibit=true
  condition_cmd=@LIBEXECDIR@/session-locked.sh
  condition_retry=10
  on-timeout=@LIBEXECDIR@/dpms-off-if-locked.sh
  on-resume=hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

listener {
  timeout=$suspend_timeout
  ignore_inhibit=true
  condition_cmd=@LIBEXECDIR@/session-locked.sh
  condition_retry=10
  on-timeout=@LIBEXECDIR@/idle-suspend.sh
  on-resume=@LIBEXECDIR@/idle-suspend.sh --cancel
}
