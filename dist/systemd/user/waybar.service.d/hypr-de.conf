# hypr-DE: launch waybar against the packaged config and the lmtt-rendered
# stylesheet. Users override by masking this drop-in or adding their own with
# a later name.
[Unit]
# One health check per start (see waybar-watchdog.service); the oneshot
# returns to inactive, so each new start job pulls it in again.
Wants=waybar-watchdog.service

[Service]
ExecStart=
ExecStart=/usr/bin/waybar -c @DATADIR@/waybar/config.jsonc -s %h/.config/hypr-de/waybar.css
