# hypr-DE: run hypridle against the packaged idle policy, with this host's
# timeouts from ~/.config/hypr-de/hypridle.conf spliced in by
# hypridle-launch. The launcher also owns the root-only binary search that
# used to be inline here (why neither $PATH nor `command -v` may pick the
# binary is explained at the top of the script).
[Service]
ExecStart=
ExecStart=@LIBEXECDIR@/hypridle-launch
