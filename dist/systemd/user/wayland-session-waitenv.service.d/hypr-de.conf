# uwsm's waitenv checks for the session's variables every 0.5 s, which holds
# graphical-session.target up to 0.5 s after they arrive. hypr-DE's Hyprland
# session needs no such guard: Hyprland's own ready is off, and main.lua
# declares the session ready right after the one export that carries every
# variable this unit waits for. It runs whenever any of these differs from
# hypr-DE's stock value, so other compositors and a user's own wait list,
# settle or Hyprland ready keep it.
[Unit]
ConditionEnvironment=|!HYPRLAND_NO_SD_NOTIFY=1
ConditionEnvironment=|!UWSM_WAIT_VARNAMES=HYPRLAND_INSTANCE_SIGNATURE
ConditionEnvironment=|!UWSM_WAIT_VARNAMES_SETTLETIME=0
