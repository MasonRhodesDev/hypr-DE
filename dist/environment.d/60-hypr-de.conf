# hypr-DE defaults for the systemd user manager. The per-user
# ~/.config/environment.d/wallpaper.conf (written by hypr-de-set-wallpaper)
# sorts later and overrides this fallback.
WALLPAPER_PATH=@DATADIR@/wallpapers/default.png

# Toolkit env for LMTT portal appearance and Qt/GTK apps started as user
# services (uwsm/env covers the compositor session; this covers systemd).
QT_QPA_PLATFORMTHEME=qt6ct
QT_QPA_PLATFORM=wayland
GTK_USE_PORTAL=1
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=wayland
XCURSOR_SIZE=24
GNOME_KEYRING_CONTROL=${XDG_RUNTIME_DIR}/keyring
