# Single source of truth for every install path token used in dist/ sources.
# substitute.sh and install.sh source this; the spec and PKGBUILD override
# per-distro values via environment (see LIBEXECDIR / WAYBAR_CFFI below).
# NOTHING in dist/ may contain a literal install path — CI greps for that.

BINDIR="${BINDIR:-/usr/bin}"
DATADIR="${DATADIR:-/usr/share/hypr-de}"
# Fedora: /usr/libexec/hypr-de.  Arch has no libexec: /usr/lib/hypr-de.
LIBEXECDIR="${LIBEXECDIR:-/usr/libexec/hypr-de}"
UNITDIR="${UNITDIR:-/usr/lib/systemd/user}"
PRESETDIR="${PRESETDIR:-/usr/lib/systemd/user-preset}"
ENVGENDIR="${ENVGENDIR:-/usr/lib/environment.d}"
XDGCONFDIR="${XDGCONFDIR:-/etc/xdg}"
# greetd's config dir is /etc/greetd on every distro; vigil reads
# /etc/greetd/vigil.toml as its system config.
GREETDDIR="${GREETDDIR:-/etc/greetd}"
MANDIR="${MANDIR:-/usr/share/man}"
# waybar CFFI module path: Fedora %{_libdir} = lib64, Arch = lib.
WAYBAR_CFFI="${WAYBAR_CFFI:-/usr/lib64/waybar/workspace_buttons.so}"
